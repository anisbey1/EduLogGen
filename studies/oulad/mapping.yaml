# Field mapping for the event files written by prepare.py.
fields:
  event_id: event_id
  # OULAD student ids are already anonymised; they are kept so profiles can
  # be compared with final results. For identifiable data, add
  # `hash: {salt: <secret>}` (see examples/configs/demo_mapping.yaml).
  learner_id: student
  timestamp:
    source: time
    format: "%Y-%m-%dT%H:%M:%SZ"
  activity_id: site
  event_type: activity_type
  session_id: session
  course_id: presentation

metadata: [clicks]
timezone: UTC

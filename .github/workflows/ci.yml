# Continuous integration for EduLogGen.
#
# Runs linting, formatting checks, type checking, unit tests, and a package
# build on every push and pull request targeting the main branch.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with development extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Black format check
        run: black --check src tests

      - name: MyPy type check
        run: mypy

      - name: PyTest with coverage
        run: pytest --cov=eduloggen --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  neural:
    name: Neural generator (PyTorch, CPU)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with the neural extra (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,neural]"

      - name: GRU generator tests
        run: pytest tests/generators/test_gru.py --no-cov -q

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  smoke:
    name: End-to-end smoke run
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (no extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Pipeline on the synthetic demo corpus
        working-directory: ${{ runner.temp }}
        run: |
          eduloggen demo --output demo --learners 40
          eduloggen sessionize --input demo --output sessions
          eduloggen fit --input sessions --generator semi_markov --output model
          eduloggen generate --model model --n-sessions 50 --seed 1 --output synthetic
          eduloggen validate --real sessions --synthetic synthetic \
            --threshold event_type_tvd=0.5 --output report

      - name: Benchmark protocol session_fidelity_v1
        working-directory: ${{ runner.temp }}
        run: eduloggen benchmark --input sessions --seeds 1 --output benchmark

      - name: Upload smoke outputs
        uses: actions/upload-artifact@v4
        with:
          name: smoke-outputs
          path: |
            ${{ runner.temp }}/report
            ${{ runner.temp }}/benchmark

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with docs extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Build MkDocs site
        run: mkdocs build --strict
